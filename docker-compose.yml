
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: micro_test
      POSTGRES_USER: micro_test
      POSTGRES_PASSWORD: micro_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micro_test -d micro_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  micro-test:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - source: go-ca
          target: go-ca
    ports:
      - "8089:8089"
    environment:
      PORT: "8089"
      DATABASE_URL: postgres://micro_test:micro_test@postgres:5432/micro_test?sslmode=disable
      JWT_USERNAME: ${JWT_USERNAME:?JWT_USERNAME is required}
      JWT_PASSWORD: ${JWT_PASSWORD:?JWT_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  go-ca:
    file: ${GO_CA_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
