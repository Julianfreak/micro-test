basePath: /
definitions:
  httpapi.errorResponse:
    properties:
      error:
        type: string
    type: object
  httpapi.healthResponse:
    properties:
      agent:
        type: string
      status:
        type: string
    type: object
  inventory.Item:
    properties:
      name:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8089
info:
  contact:
    email: support@swagger.io
    name: Soporte Técnico
  description: API de inventario para un microservicio de referencia en Go.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Micro-Test Inventory API
  version: "1.0"
paths:
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.healthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Check service readiness
      tags:
      - health
  /health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.healthResponse'
      summary: Check whether the process is alive
      tags:
      - health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.healthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Check service readiness
      tags:
      - health
  /items:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/inventory.Item'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: List inventory items
      tags:
      - inventory
    post:
      consumes:
      - application/json
      parameters:
      - description: Inventory item
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/inventory.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/inventory.Item'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Create an inventory item
      tags:
      - inventory
  /items/{sku}:
    delete:
      parameters:
      - description: Stock keeping unit
        in: path
        name: sku
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Delete an inventory item
      tags:
      - inventory
    get:
      parameters:
      - description: Stock keeping unit
        in: path
        name: sku
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inventory.Item'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Get an inventory item
      tags:
      - inventory
    put:
      consumes:
      - application/json
      parameters:
      - description: Stock keeping unit
        in: path
        name: sku
        required: true
        type: string
      - description: Updated inventory item; SKU must match the path
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/inventory.Item'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inventory.Item'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Update an inventory item
      tags:
      - inventory
swagger: "2.0"
