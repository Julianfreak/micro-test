basePath: /
definitions:
  httpapi.errorResponse:
    properties:
      error:
        type: string
    type: object
  httpapi.healthResponse:
    properties:
      agent:
        type: string
      status:
        type: string
    type: object
  httpapi.sessionResponse:
    properties:
      expires_in:
        type: integer
    type: object
  httpapi.tokenRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  httpapi.tokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  inventory.Item:
    properties:
      name:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8089
info:
  contact:
    email: support@swagger.io
    name: Soporte Técnico
  description: API de inventario para un microservicio de referencia en Go.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Micro-Test Inventory API
  version: "1.0"
paths:
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: End the browser session
      tags:
      - auth
  /auth/session:
    post:
      consumes:
      - application/json
      parameters:
      - description: Configured username and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/httpapi.tokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.sessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Create a persistent browser session
      tags:
      - auth
  /auth/token:
    post:
      consumes:
      - application/json
      parameters:
      - description: Configured username and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/httpapi.tokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      summary: Obtain a JWT access token
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.healthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - BearerAuth: []
      summary: Check service readiness
      tags:
      - health
  /health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.healthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - BearerAuth: []
      summary: Check whether the process is alive
      tags:
      - health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.healthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - BearerAuth: []
      summary: Check service readiness
      tags:
      - health
  /items:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/inventory.Item'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - BearerAuth: []
      summary: List inventory items
      tags:
      - inventory
    post:
      consumes:
      - application/json
      parameters:
      - description: Inventory item
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/inventory.Item'
      - description: Optional key for safely retrying this request
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/inventory.Item'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - BearerAuth: []
      summary: Create an inventory item
      tags:
      - inventory
  /items/{sku}:
    delete:
      parameters:
      - description: Stock keeping unit
        in: path
        name: sku
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete an inventory item
      tags:
      - inventory
    get:
      parameters:
      - description: Stock keeping unit
        in: path
        name: sku
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inventory.Item'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - BearerAuth: []
      summary: Get an inventory item
      tags:
      - inventory
    put:
      consumes:
      - application/json
      parameters:
      - description: Stock keeping unit
        in: path
        name: sku
        required: true
        type: string
      - description: Updated inventory item; SKU must match the path
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/inventory.Item'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inventory.Item'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - BearerAuth: []
      summary: Update an inventory item
      tags:
      - inventory
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer" followed by a space and a valid JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
