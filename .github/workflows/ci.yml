name: Go CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.3'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run Build
      run: go build -v ./...

    - name: Run Tests
      run: go test -race -coverprofile=coverage.out -covermode=atomic -v ./...

    - name: Report coverage
      run: go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t micro-test:latest .
